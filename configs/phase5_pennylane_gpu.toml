# Phase 5 (circuits) on lightning.gpu (cuStateVec) inside WSL2 Ubuntu - circuits that were NOT RUN
# on Windows because lightning.gpu is unavailable there.
#   wsl -d Ubuntu -- ~/venvs/epsqec/bin/python experiments/phase5_pennylane.py --config phase5_pennylane_gpu.toml
experiment_name = "phase5_pennylane_gpu"
seed = 778
device = "lightning.gpu"
c_dtype = "complex128"          # 2^29 amplitudes = 8.6 GB fits the 16 GB card
adder_all_k_limit = 85
adder_sample_k = 6
gate_test_random_u = 6
gate_tests = ["Z25", "Z85", "Z325"]
prop5_z_syndrome = ["Z25", "Z85", "Z325"]
x_syndrome = ["Z25", "Z85", "Z325"]
x_syndrome_errors = { Z25 = 8, Z85 = 8, Z325 = 8 }
full_cycle = ["Z25"]                      # qml.measure + qml.cond (deferred), as on Windows
full_cycle_pairs = 6
full_cycle_coherent = ["Z25", "Z85"]      # ancilla-controlled feed-forward, returns the full state
full_cycle_coherent_pairs = 4
max_wires = 29
gate_set = ["CNOT", "RZ", "RY", "RX", "PhaseShift", "ControlledPhaseShift", "Hadamard", "PauliX", "QubitUnitary", "Toffoli", "SWAP", "GlobalPhase"]

[[codes]]
key = "Z25"

[[codes]]
key = "Z85"

[[codes]]
key = "Z325"
