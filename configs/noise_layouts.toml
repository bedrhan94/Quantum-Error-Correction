# Step 6 of the gate-level spec: noise, run only for codes whose gate-level steps 1-5 all PASSed
# (read from the latest results/quantum/gate_level_css-* run).
seed = 6060
gate_level_prefix = "gate_level_css"

[qudit]
codes = ["Z25", "Z65", "Z85"]
p_grid = [1e-4, 1e-3, 1e-2, 3e-2, 0.1, 0.2]
mc_p = 0.05
mc_trials = { Z25 = 40000, Z65 = 20000, Z85 = 20000 }
mc_batch = { Z25 = 4000, Z65 = 2000, Z85 = 2000 }

[qubit]
code = "Z25"
channels = ["bit_flip", "phase_flip", "depolarizing", "amplitude_damping", "phase_damping"]
p_grid = [1e-4, 1e-3, 1e-2, 3e-2, 0.1]
gpu_chunk = 5
cpu_crosscheck_p = 0.01          # layout B (GPU complex64) re-evaluated on CPU complex128 at this p

[[codes]]
key = "Z25"

[[codes]]
key = "Z65"
q = 65
alpha1 = [4, 7]
alpha2 = [3, 2]
eps = "multiples"

[[codes]]
key = "Z85"
