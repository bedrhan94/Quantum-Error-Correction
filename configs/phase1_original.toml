dual_n2_cases = [
  { q = 5,  gen = [[2, 1], [1, 0]] },
  { q = 5,  gen = [[1, 2], [3, 4]] },
  { q = 13, gen = [[3, 2], [1, 1]] },
]
# double-dual consistency of the original hermitian_dual() (latent-bug probe)
double_dual_case = { q = 5, gen = [[2, 1], [1, 0]] }
