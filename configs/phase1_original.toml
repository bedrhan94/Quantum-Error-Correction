# Phase 1: run the authors' code unchanged and check the paper's worked examples with it.
seed = 20260625
examples = ["Z25", "Z85", "Z325"]
# exhaustive decoding of every y in R with the ORIGINAL decode() (Python objects; Z325 ~ 105625 words)
exhaustive_all_R = true
# original run_simulation() re-run with a fixed seed (the file itself never seeds `random`)
simulation_trials = 5000
